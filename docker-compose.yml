services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: homestock_user
      POSTGRES_PASSWORD: homestock_pass
      POSTGRES_DB: homestock_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  web:
    build: .
    ports:
      - "5000:5000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - RUN_MODE=web
    restart: unless-stopped

  bot:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - RUN_MODE=bot
    command: ["python", "run_bot.py"]
    restart: unless-stopped

  scheduler:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - RUN_MODE=scheduler
    command: ["python", "run_scheduler.py"]
    restart: unless-stopped

volumes:
  postgres_data:
